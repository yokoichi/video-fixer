<h1>Video Fixer</h1>
<p>Pixel / Google フォトの VP9 mp4 を、Mac・iPhone で再生できる H.264 + AAC の mp4 に変換します。動画はブラウザ内で処理され、サーバーには送信されません。</p>
<div class="row"><label>画質 <select id="preset"></select></label></div>
<div id="drop">ここに動画をドラッグ＆ドロップ、またはクリックして選択<br><small>複数ファイル可</small></div>
<input id="picker" type="file" accept="video/*,.mp4,.mov,.webm,.mkv" multiple hidden>
<p id="note" hidden>このブラウザは WebCodecs 非対応のため、互換モード（低速）で変換します。</p>
<div id="list"></div>
